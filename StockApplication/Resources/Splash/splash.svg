<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="80" height="80" rx="8" ry="8" fill="#512BD4" />
  
  <!-- Stacked Boxes -->
  <g transform="translate(15, 15) scale(0.45)">
    <!-- Bottom Box -->
    <rect x="0" y="60" width="70" height="70" rx="5" ry="5" fill="#4682b4" stroke="#2c5b82" stroke-width="2" />
    <!-- Middle Box -->
    <rect x="15" y="30" width="70" height="70" rx="5" ry="5" fill="#5f9ea0" stroke="#3d6566" stroke-width="2" />
    <!-- Top Box -->
    <rect x="30" y="0" width="70" height="70" rx="5" ry="5" fill="#87ceeb" stroke="#5da3c5" stroke-width="2" />
    
    <!-- Simplified Barcode on Middle Box -->
    <g transform="translate(25, 50)">
      <rect x="0" y="0" width="5" height="30" fill="#2c5b82" />
      <rect x="9" y="0" width="7" height="30" fill="#2c5b82" />
      <rect x="20" y="0" width="3" height="30" fill="#2c5b82" />
      <rect x="27" y="0" width="5" height="30" fill="#2c5b82" />
      <rect x="36" y="0" width="4" height="30" fill="#2c5b82" />
      <rect x="44" y="0" width="6" height="30" fill="#2c5b82" />
    </g>
  </g>
  
  <!-- Graph Arrow -->
  <g transform="translate(50, 25) scale(0.5)">
    <path d="M0,40 L30,10 L40,10 L40,0 L25,0 L25,15 L0,40Z" fill="#4169e1" />
  </g>
  
  <!-- Simplified Clipboard -->
  <g transform="translate(44, 34) scale(0.45)">
    <rect x="0" y="0" width="60" height="80" rx="4" ry="4" fill="#dcdcdc" stroke="#696969" stroke-width="2" />
    <rect x="5" y="10" width="50" height="65" fill="#ffffff" stroke="#696969" stroke-width="1" />
    
    <!-- Clipboard Top -->
    <rect x="22" y="-6" width="16" height="12" rx="3" ry="3" fill="#b22222" stroke="#8b0000" stroke-width="1" />
    
    <!-- Checkmarks -->
    <g fill="#228b22">
      <path d="M15,25 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" />
      <path d="M15,45 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" />
      <path d="M15,65 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" />
    </g>
  </g>
  
  <!-- SM Initials -->
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f4f4f">SM</text>
</svg>