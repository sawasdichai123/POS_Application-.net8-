<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <!-- Background -->
    <rect x="85" y="85" width="286" height="286" rx="40" ry="40" fill="#f0f8ff" style="fill-rule:nonzero"/>
    
    <!-- Stacked Boxes -->
    <g transform="translate(130, 150) scale(1.8)">
        <!-- Bottom Box -->
        <rect x="0" y="60" width="70" height="70" rx="5" ry="5" fill="#4682b4" stroke="#2c5b82" stroke-width="2" style="fill-rule:nonzero"/>
        <!-- Middle Box -->
        <rect x="15" y="30" width="70" height="70" rx="5" ry="5" fill="#5f9ea0" stroke="#3d6566" stroke-width="2" style="fill-rule:nonzero"/>
        <!-- Top Box -->
        <rect x="30" y="0" width="70" height="70" rx="5" ry="5" fill="#87ceeb" stroke="#5da3c5" stroke-width="2" style="fill-rule:nonzero"/>
        
        <!-- Simplified Barcode on Middle Box -->
        <g transform="translate(25, 50)">
            <rect x="0" y="0" width="5" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
            <rect x="9" y="0" width="7" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
            <rect x="20" y="0" width="3" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
            <rect x="27" y="0" width="5" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
            <rect x="36" y="0" width="4" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
            <rect x="44" y="0" width="6" height="30" fill="#2c5b82" style="fill-rule:nonzero"/>
        </g>
    </g>
    
    <!-- Graph Arrow -->
    <g transform="translate(260, 190) scale(2)">
        <path d="M0,40 L30,10 L40,10 L40,0 L25,0 L25,15 L0,40Z" fill="#4169e1" style="fill-rule:nonzero"/>
    </g>
    
    <!-- Simplified Clipboard -->
    <g transform="translate(250, 250) scale(1.8)">
        <rect x="0" y="0" width="60" height="80" rx="4" ry="4" fill="#dcdcdc" stroke="#696969" stroke-width="2" style="fill-rule:nonzero"/>
        <rect x="5" y="10" width="50" height="65" fill="#ffffff" stroke="#696969" stroke-width="1" style="fill-rule:nonzero"/>
        
        <!-- Clipboard Top -->
        <rect x="22" y="-6" width="16" height="12" rx="3" ry="3" fill="#b22222" stroke="#8b0000" stroke-width="1" style="fill-rule:nonzero"/>
        
        <!-- Checkmarks -->
        <g fill="#228b22">
            <path d="M15,25 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" style="fill-rule:nonzero"/>
            <path d="M15,45 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" style="fill-rule:nonzero"/>
            <path d="M15,65 l3,5 l7,-7" stroke="#228b22" stroke-width="2" fill="none" style="fill-rule:nonzero"/>
        </g>
    </g>
    
    <!-- SM Initials -->
    <path d="M 185,370 c -2.7,0 -5,-0.9 -6.9,-2.7 -1.9,-1.8 -2.8,-4 -2.8,-6.6 0,-2.6 0.9,-4.8 2.8,-6.7 1.9,-1.8 4.2,-2.8 6.9,-2.8 2.7,0 5.1,0.9 7,2.8 1.9,1.8 2.9,4.1 2.9,6.7 0,2.5 -1,4.7 -2.9,6.6 -1.9,1.8 -4.2,2.7 -7,2.7 z" style="fill:#2f4f4f;fill-rule:nonzero"/>
    <path d="M 293.5,368.5 H 276 l-46.3,-73 c-1.2,-1.8 -2.1,-3.8 -2.9,-5.8 h-0.4 c 0.4,2.1 0.5,6.7 0.5,13.6 v 65.1 h-15.5 v -99.4 h 18.7 l 44.7,71.3 c 1.9,3 3.1,5 3.6,6.1 h 0.3 c -0.5,-2.6 -0.7,-7.1 -0.7,-13.4 v-64 h 15.5 z" style="fill:#2f4f4f;fill-rule:nonzero"/>
</svg>